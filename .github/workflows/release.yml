name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Pinned by SHA deliberately: this workflow receives the AUR key.
    # Bump the pin manually when bnema/gh-actions changes.
    uses: bnema/gh-actions/.github/workflows/go-release.yml@c53682d2c64181019affd71b1707e5a189912ddd
    with:
      go-version-file: go.mod
      goreleaser-version: '~> v2'
    secrets:
      AUR_KEY: ${{ secrets.AUR_KEY }}
