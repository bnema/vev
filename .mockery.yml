all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/bnema/vev/internal/ports:
    config:
      all: true
      dir: internal/ports/mocks
      filename: '{{.InterfaceFile | base | trimSuffix ".go"}}_mock.go'
      pkgname: portsmocks
  github.com/bnema/vev/internal/protocol/wire:
    config:
      dir: internal/protocol/wire/mocks
      filename: transport_mock.go
      pkgname: wiremocks
    interfaces:
      Transport:
      DatagramTransport:
      AsyncTransport:
      OwnedSynchronousTransport:
      Dialer:
      Listener:
      BoundedTransport:
  github.com/bnema/vev/internal/adapters/daemonmux:
    config:
      dir: internal/adapters/daemonmux
      filename: daemonmux_mock_test.go
      pkgname: daemonmux
    interfaces:
      RawFramedTransport:
      FramedCarrier:
  github.com/bnema/vev/internal/app:
    config:
      dir: internal/app
      filename: lifecycle_ownership_mock_test.go
      pkgname: app
    interfaces:
      lifecycleOwnership:
  github.com/bnema/vev/internal/usecase/broker:
    config:
      dir: internal/usecase/broker
      filename: broker_seams_mock_test.go
      pkgname: broker
    interfaces:
      Runner:
      Closeable:
      LocalProbe:
  github.com/bnema/vev/internal/usecase/keys:
    config:
      dir: internal/usecase/keys
      filename: handler_mock_test.go
      pkgname: keys
    interfaces:
      Handler:
  github.com/bnema/vev/cmd/vev-perf-harness:
    config:
      dir: cmd/vev-perf-harness
      filename: harness_mock_test.go
      pkgname: main
      template-data:
        mock-build-tags: linux
    interfaces:
      clock:
      launchedProcess:
      launcher:
  github.com/bnema/vev/internal/usecase/daemon:
    interfaces:
      daemonActionRunner:
        config:
          dir: internal/usecase/daemon
          filename: action_runner_mock_test.go
          pkgname: daemon
      barScriptExecutor:
        config:
          dir: internal/usecase/daemon
          filename: bar_script_executor_mock_test.go
          pkgname: daemon
  github.com/bnema/vev/internal/usecase/client:
    interfaces:
      attachmentPredictionForeground:
        config:
          dir: internal/usecase/client
          filename: prediction_foreground_mock_test.go
          pkgname: client
      AttachmentWorker:
        config:
          dir: internal/usecase/client
          filename: attachment_worker_mock_test.go
          pkgname: client
      pickerPresentationHost:
        config:
          dir: internal/usecase/client
          filename: picker_presentation_host_mock_test.go
          pkgname: client
      pickerHost:
        config:
          dir: internal/usecase/client
          filename: picker_host_mock_test.go
          pkgname: client
  github.com/bnema/vev/internal/usecase/command:
    interfaces:
      Context:
        config:
          dir: internal/usecase/command
          filename: context_mock_test.go
          pkgname: command
      ControlContext:
        config:
          dir: internal/usecase/command
          filename: control_context_mock_test.go
          pkgname: command
