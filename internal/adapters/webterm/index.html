<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>vev · terminal</title>
<link rel="stylesheet" href="/terminal.css">
<script defer src="/terminal.js"></script>
<script defer src="/app.js"></script>
</head>
<body>
<header>
<strong>vev</strong>
<span id="connection" data-state="connecting" title="Connecting…"><i aria-hidden="true"></i><span id="status" class="sr-only" role="status">Connecting…</span></span>
<span id="views" title="Connected browser terminal views"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span id="view-count" aria-hidden="true">—</span><span id="view-description" class="sr-only">Connected browser terminal views: unknown</span></span>
<span class="header-space"></span>
<button id="select-mode" class="touch-control" type="button" aria-pressed="false" title="Select text without sending terminal input">Select</button>
<button id="keyboard" class="touch-control" type="button" title="Open terminal keyboard">Keys</button>
<button id="palette" type="button" title="Command palette · Alt+Space" aria-label="Command palette"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 11 2-2-2-2M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg></button>
<button id="reconnect" type="button" title="Reconnect" aria-label="Reconnect" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></svg></button>
</header>
<main id="workspace"><div id="terminal"></div></main>
<p id="help" hidden>Open the private link printed by <code>vev --web-daemon</code> to connect. Browser-reserved shortcuts remain owned by the browser.</p>
<noscript>This terminal requires its small native JavaScript adapter. No frontend framework is used.</noscript>
</body>
</html>
