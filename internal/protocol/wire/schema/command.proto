// Control commands. Request-level version fields stay at this staged
// revision; P4.1 removes them once the preamble owns compatibility.
syntax = "proto3";

package vev.wire.v1;

option go_package = "github.com/bnema/vev/internal/protocol/wire";

// CommandRequest asks the daemon to run one control command.
message CommandRequest {
  uint32 version = 1;
  uint64 request_id = 2;
  bool attached = 3;
  bool self = 4;
  string slug = 5;
  repeated string args = 6;
  string target_session = 7;
  string target_tab = 8;
  string target_pane = 9;
  bool json = 10;
}

// CommandOutcome is the closed terminal state of a command request.
enum CommandOutcome {
  COMMAND_OUTCOME_UNSPECIFIED = 0;
  COMMAND_OUTCOME_SUCCEEDED = 1;
  COMMAND_OUTCOME_FAILED = 2;
  COMMAND_OUTCOME_UNKNOWN = 3;
}

// CommandResult reports a control command's explicit terminal outcome.
message CommandResult {
  uint64 request_id = 1;
  reserved 2;
  reserved "ok";
  uint32 code = 3;
  string text = 4;
  string output = 5;
  CommandOutcome outcome = 6;
}
